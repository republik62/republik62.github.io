<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Republik +62 Jilid 2 — Dari OKB Jadi Pejabat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ecee; --fg:#14202b; --muted:#5b6b78; --panel:#ffffff; --line:#c9d3d8;
  --felt:#0e6b5c; --felt2:#0b5a4d; --tile:#fbfbf7; --tileline:#9fb3ad;
  --merah:#d81e2c; --emas:#f2b705; --good:#1c8a4a; --bad:#c62828;
  --takdir:#5b3fa8; --musibah:#d4550f; --shadow:0 8px 28px rgba(10,30,40,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1f; --fg:#e8eef0; --muted:#93a4ae; --panel:#18252c; --line:#2b3c45;
    --felt:#0b4d43; --felt2:#083d35; --tile:#1d2c33; --tileline:#35504a; --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --fg:#e8eef0; --muted:#93a4ae; --panel:#18252c; --line:#2b3c45;
  --felt:#0b4d43; --felt2:#083d35; --tile:#1d2c33; --tileline:#35504a; --shadow:0 8px 28px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:.5em .9em;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
button.primary{background:var(--merah);border-color:var(--merah);color:#fff}
button.ghost{background:transparent}
h1,h2,h3{font-family:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;margin:0}

.app{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding:12px;max-width:1440px;margin:0 auto}
@media (max-width:920px){.app{grid-template-columns:1fr}}
.board-wrap{display:flex;justify-content:center;align-items:flex-start}

/* ---------- BOARD ---------- */
.board{position:relative;width:min(100%, calc(100vh - 24px));width:min(100%, calc(100dvh - 24px));aspect-ratio:1;container-type:size;
  display:grid;grid-template-columns:1.35fr repeat(8,1fr) 1.35fr;grid-template-rows:1.35fr repeat(8,1fr) 1.35fr;
  background:var(--felt);border:.8cqw solid #5a3a1e;border-radius:1.6cqw;box-shadow:var(--shadow);gap:.25cqw;padding:.25cqw}
.tile{position:relative;background:var(--tile);display:flex;overflow:hidden;font-size:clamp(6px,1.3cqw,12.5px);line-height:1.12;cursor:pointer;border-radius:.4cqw}
.tile:hover{filter:brightness(1.04)}
.tile .band{flex:0 0 22%}
.side-b{flex-direction:column}.side-t{flex-direction:column-reverse}.side-l{flex-direction:row-reverse}.side-r{flex-direction:row}
.side-l .band,.side-r .band{flex-basis:15%}
.tile .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.3cqw;gap:.15cqw;min-width:0}
.tile .nm{font-weight:700;overflow-wrap:anywhere}
.tile .pr{color:var(--muted);font-size:.9em;font-weight:600}
.tile .ic{font-size:2em;line-height:1}
.tile .lv{font-size:.95em;letter-spacing:-.1em;min-height:0}
.tt-takdir{background:color-mix(in srgb,var(--takdir) 16%,var(--tile))}
.tt-musibah{background:color-mix(in srgb,var(--musibah) 16%,var(--tile))}
.tt-tax{background:color-mix(in srgb,var(--muted) 12%,var(--tile))}
.corner .ic{font-size:3.2em}
.corner .nm{font-size:1.15em;font-family:"Bricolage Grotesque",sans-serif}
.corner .sub{font-size:.9em;color:var(--muted)}
.k-go{background:color-mix(in srgb,var(--good) 20%,var(--tile))}
.k-jail{background:repeating-linear-gradient(90deg,var(--tile) 0 1.1cqw,color-mix(in srgb,var(--fg) 14%,var(--tile)) 1.1cqw 1.4cqw)}
.k-bansos{background:color-mix(in srgb,var(--emas) 26%,var(--tile))}
.k-gojail{background:color-mix(in srgb,var(--merah) 20%,var(--tile))}
.tokens{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:.25cqw;pointer-events:none;z-index:2}
.token{width:3.3cqw;height:3.3cqw;border-radius:50%;background:#fff;border:.45cqw solid var(--c);display:grid;place-items:center;font-size:1.85cqw;box-shadow:0 .3cqw .6cqw rgba(0,0,0,.4);animation:hop .2s ease-out}
.token.active{outline:.3cqw solid var(--emas);outline-offset:.15cqw}
@keyframes hop{0%{transform:translateY(-35%) scale(1.1)}100%{transform:none}}

/* ---------- CENTER ---------- */
.center{grid-area:2/2/10/10;background:radial-gradient(circle at 50% 45%,var(--felt) 0,var(--felt2) 100%);color:#f5f7f2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2cqw 2.4cqw;gap:1cqw;border-radius:.6cqw;overflow:hidden}
.ctop{width:100%;display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.stamp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:5.4cqw;line-height:.95;color:#fff;border:.5cqw solid #fff;padding:.5cqw 2cqw .8cqw;border-radius:1cqw;transform:rotate(-3deg);background:var(--merah);box-shadow:0 .5cqw 0 rgba(0,0,0,.25);letter-spacing:-.02em;text-align:center}
.stamp small{display:block;font-size:.3em;font-weight:700;letter-spacing:0;margin-top:.3cqw;font-family:"Plus Jakarta Sans",sans-serif}
.ticker{width:100%;overflow:hidden;white-space:nowrap;background:rgba(0,0,0,.28);border-radius:.6cqw;font-size:clamp(9px,1.55cqw,14px);padding:.45cqw 0}
.ticker span{display:inline-block;padding-left:100%;animation:marquee 70s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
.cmid{display:flex;align-items:center;justify-content:center;gap:3cqw;width:100%}
.deck{width:13cqw;height:18cqw;border-radius:1.2cqw;border:.4cqw solid rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;text-align:center;font-size:clamp(8px,1.45cqw,13px);font-weight:800;box-shadow:.5cqw .5cqw 0 rgba(0,0,0,.25), 1cqw 1cqw 0 rgba(0,0,0,.12)}
.deck div{font-size:4cqw}
.deck.takdir{background:var(--takdir);transform:rotate(-7deg)}
.deck.musibah{background:var(--musibah);transform:rotate(7deg)}
.deck.flash{animation:flash .6s ease-out}
@keyframes flash{50%{filter:brightness(1.5);scale:1.08}}
.dicewrap{display:flex;flex-direction:column;align-items:center;gap:1cqw}
.dice{display:flex;gap:3cqw;perspective:60cqw;padding:1cqw}
.die{--d:8.5cqw;width:var(--d);height:var(--d);position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.15,.85,.25,1)}
.face{position:absolute;inset:0;background:#fffdf8;border:1px solid #d9d2c3;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;box-shadow:inset 0 0 1.4cqw rgba(0,0,0,.18)}
.pip{width:72%;height:72%;border-radius:50%;background:#1b1b1b;place-self:center}
.pip.red{background:var(--merah)}
.f1{transform:translateZ(calc(var(--d)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--d)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--d)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--d)/2))}
.f5{transform:rotateX(90deg) translateZ(calc(var(--d)/2))}
.f2{transform:rotateX(-90deg) translateZ(calc(var(--d)/2))}
.sum{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:3cqw;min-height:1em}
.cbot{width:100%;display:flex;flex-direction:column;align-items:center;gap:1cqw}
.status{text-align:center;font-size:clamp(10px,1.7cqw,15px)}
.turnchip{display:inline-block;background:var(--pc);color:#fff;font-weight:800;padding:.2em .7em;border-radius:99px;border:2px solid #fff}
.jailtag{font-weight:700}
.hint{opacity:.85;margin-top:.3em}
.controls{display:flex;flex-wrap:wrap;gap:.8cqw;justify-content:center;min-height:2.4em}
.controls button{font-size:clamp(11px,1.75cqw,15px);padding:.55em 1em}
.controls button.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.thinking{font-weight:700;opacity:.9;font-size:clamp(10px,1.7cqw,15px);padding:.5em}
.meta{display:flex;gap:2.5cqw;font-size:clamp(9px,1.5cqw,13px);opacity:.9;flex-wrap:wrap;justify-content:center}

/* ---------- SIDE ---------- */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:921px){.side{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto;padding-right:4px}}
.sidehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidehead h2,.side>h2{font-size:1.25rem}
.sidehead div{display:flex;gap:6px}
.pcard{background:var(--panel);border-radius:14px;padding:12px 12px 10px;border-left:6px solid var(--pc);box-shadow:0 2px 8px rgba(10,30,40,.07);margin-bottom:10px;transition:transform .2s}
.pcard.active{box-shadow:0 0 0 2px var(--pc),0 6px 18px rgba(10,30,40,.14)}
.pcard.dead{opacity:.5;filter:grayscale(.8)}
.ph{display:flex;align-items:center;gap:10px}
.pav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--pc) 18%,var(--panel));border:3px solid var(--pc);flex:none}
.pname{font-weight:800}
.tag{font-size:.7em;background:var(--muted);color:var(--panel);padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:2px}
.psub{font-size:.8em;color:var(--muted)}
.pcash{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;white-space:nowrap}
.pmeta{font-size:.82em;color:var(--muted);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.chip{min-width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;padding:0 3px;border:1px solid rgba(0,0,0,.2)}
.chip.n{background:var(--line);color:var(--fg)}
.notes-tg{font-size:.78em;padding:3px 8px;border-radius:7px}
.notes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.note{position:relative;width:62px;height:32px;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 rgba(0,0,0,.18), 4px 4px 0 rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.35)}
.note::before{content:"";position:absolute;inset:3px;border:1px dashed rgba(255,255,255,.45);border-radius:2px}
.note small{font-size:8px;font-weight:600}
.note b{position:absolute;top:-7px;right:-6px;background:var(--fg);color:var(--panel);font-size:10px;border-radius:99px;padding:0 5px}
.log{list-style:none;margin:0;padding:0;font-size:.85em;background:var(--panel);border-radius:14px;max-height:340px;overflow:auto;min-height:120px}
.log:empty::before{content:"Belum ada kabar. Kejadian permainan akan muncul di sini.";display:block;padding:12px;color:var(--muted)}
.log li.fresh{animation:freshin 1.6s ease-out}
@keyframes freshin{0%{background:color-mix(in srgb,var(--emas) 40%,var(--panel))}100%{background:transparent}}
.lastnews{width:100%;max-width:62cqw;background:rgba(0,0,0,.3);border-radius:.8cqw;padding:.6cqw 1.2cqw;font-size:clamp(10px,1.55cqw,14px);text-align:center;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.4em}
.lastnews:empty{display:none}
.lastnews b{color:#fff!important;text-shadow:0 0 6px rgba(0,0,0,.4)}
@media (min-width:921px){
  .side{overflow:hidden}
  .side>*{flex:none}
  #players{flex:0 1 auto;overflow:auto;min-height:140px}
  .side>.log{flex:1 1 240px;min-height:200px;max-height:none}
}
.log li{padding:7px 12px;border-bottom:1px solid var(--line)}
.log li:last-child{border:0}
.log li.sep{background:color-mix(in srgb,var(--fg) 5%,var(--panel));font-weight:700;color:var(--muted)}

/* ---------- OVERLAYS ---------- */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:80;pointer-events:none;width:min(420px,92vw)}
.toast{background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease-out;font-size:.9em}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.toast.out{opacity:0;transition:opacity .35s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.float{position:fixed;z-index:70;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.1rem;pointer-events:none;animation:floatup 1.3s ease-out forwards;text-shadow:0 1px 0 var(--panel)}
@keyframes floatup{to{transform:translateY(-36px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(5,15,20,.6);display:grid;place-items:center;z-index:50;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{background:var(--panel);border-radius:18px;max-width:620px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:var(--shadow)}
.sheet h3{margin:18px 0 8px;font-size:1.05rem}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.cardstage{display:flex;flex-direction:column;align-items:center;gap:14px}
.card3d{width:min(320px,86vw);aspect-ratio:5/7;perspective:1200px}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.7,.3,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4);border:6px solid #fff}
.cback{background:var(--dc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px)}
.cback div{font-size:4rem}
.cfront{transform:rotateY(180deg);background:#fffdf8;color:#1b1b1b;display:flex;flex-direction:column}
.chead{background:var(--dc);color:#fff;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cbody{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:10px}
.cbody h2{font-size:1.45rem;line-height:1.1}
.cbody p{margin:0;font-size:.95rem}
.eff{margin-top:auto;align-self:flex-start;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;padding:6px 12px;border-radius:10px;background:#eee}
.eff.pos{background:#d9f2e2;color:#11663a}.eff.neg{background:#fbe0e0;color:#a31d1d}
.deed{width:min(340px,92vw);background:#fffdf8;color:#1b1b1b;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4);border:5px solid #fff}
.deed-h{padding:14px 16px;color:#fff;text-align:center}
.deed-h small{display:block;font-size:.72rem;opacity:.9}
.deed-h h2{font-size:1.4rem;line-height:1.1;margin-top:4px}
.deed-b{padding:14px 16px}
.deed-b .flav{font-style:italic;color:#555;font-size:.88rem;margin:0 0 10px}
.deed table{width:100%;border-collapse:collapse;font-size:.88rem}
.deed td{padding:4px 0;border-bottom:1px dashed #ddd}
.deed td:last-child{text-align:right;font-weight:700}
.deed .owner{margin-top:10px;font-weight:700;font-size:.9rem}
.deed .actions{padding:0 16px 16px;margin-top:0}
.deed button{background:#fff;color:#1b1b1b;border-color:#ccc}
.deed button.primary{background:var(--merah);color:#fff;border-color:var(--merah)}

/* setup */
.setup .hero{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.setup .stampbig{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.2rem;line-height:.95;color:#fff;background:var(--merah);border:4px solid #fff;outline:3px solid var(--merah);padding:6px 14px 10px;border-radius:12px;transform:rotate(-4deg);flex:none}
.setup .stampbig small{display:block;font-size:.85rem;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700}
.setup p.lead{margin:0;color:var(--muted);font-size:.92rem}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.slot{border:2px solid var(--line);border-left:6px solid var(--pc);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.slot.off{opacity:.65}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;font-size:.8rem;padding:6px 6px;border-radius:8px}
.seg button.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.slot input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.chars{display:flex;flex-wrap:wrap;gap:4px}
.chars button{font-size:1.2rem;padding:3px 6px;border-radius:8px}
.chars button.on{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc)}
.charname{font-size:.82rem;color:var(--muted)}
.err{color:var(--bad);font-weight:700;min-height:1.2em;margin:8px 0 0}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.sw{width:14px;height:34px;border-radius:4px;flex:none}
.mrow .mi{flex:1;min-width:140px}
.mrow .mi small{display:block;color:var(--muted)}
.mrow button{font-size:.8rem;padding:6px 9px}
.rank{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rank div{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line)}
.rank .pos{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.4rem;width:28px}
.rank .ttl{font-size:.82rem;color:var(--muted)}
.rules p,.rules li{font-size:.92rem}
@media (prefers-reduced-motion:reduce){
  .die,.card-inner{transition-duration:.01s}
  .ticker span{animation:none;padding-left:0;white-space:normal}
  .token,.toast,.float,.deck.flash{animation:none}
}

/* ---------- STUDIO ---------- */
.sheet.studio{max-width:1080px;padding:18px 20px}
.studio-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.studio-top h2{font-size:1.4rem}
.savestat{font-size:.8rem;color:var(--muted);margin-left:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px;border-bottom:2px solid var(--line);padding-bottom:8px}
.tabs button{font-size:.88rem}
.tabs button.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.intro{color:var(--muted);font-size:.88rem;margin:0 0 12px;max-width:72ch}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.srow{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden;background:var(--panel)}
.srow.open{border-color:var(--fg)}
.shead{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:0;background:transparent;padding:8px 12px;font-weight:600}
.shead .idx{width:24px;color:var(--muted);font-size:.8rem;flex:none}
.shead .sw{width:10px;height:24px;border-radius:3px;flex:none;background:var(--line)}
.shead .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .meta{margin-left:auto;color:var(--muted);font-size:.82em;font-weight:500;text-align:right;flex:none;max-width:45%}
.shead .off{opacity:.5}

.danger{color:var(--bad);border-color:var(--bad)}

.plist button{display:block;width:100%;text-align:left;margin-bottom:6px;font-weight:600;padding:9px 11px}
.plist button small{display:block;font-weight:500;color:var(--muted);font-size:.78rem;margin-top:2px}
.plist button.sel{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.badge{font-size:.7rem;background:var(--good);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

.rsum{font-size:.84rem;color:var(--muted);margin:8px 0 0}

.tt-elect{background:color-mix(in srgb,var(--emas) 30%,var(--tile))}

function defaultConfig(){

    takdir:DEFAULT_TAKDIR.map((c,i)=>({id:'t'+(i+1),enabled:true,...c})),

    ranks:clone(DEFAULT_RANKS),activePreset:'std'};
}
function normRules(r){
  const o={}; r=r&&typeof r==='object'?r:{};
  for(const f of RULE_FIELDS){ if(!f.k) continue; const d=BASE_RULES[f.k], v=r[f.k];
    if(f.t==='bool') o[f.k]=typeof v==='boolean'?v:d;
    else if(f.t==='select') o[f.k]=f.opts.some(x=>x[0]===v)?v:d;
    else o[f.k]=num(v,d,f.min,f.max); }
  return o;
}
function fillTile(t,def){
  const ty=t.t; const base=TDEF[ty]||{};
  const o={t:ty,name:str(t.name,def.name||'Kotak',60),short:str(t.short,def.short||t.name||'Kotak',24),icon:str(t.icon,base.icon||def.icon||'',8)};
  if(ty==='prop'){ o.g=DEFAULT_GROUPS[t.g]?t.g:'brown'; o.price=num(t.price,base.price,0); o.build=num(t.build,base.build,0);
    const r=Array.isArray(t.rent)?t.rent:base.rent; o.rent=[0,1,2,3].map(k=>num(r[k],base.rent[k],0)); o.flavor=str(t.flavor,'',400); }
  if(ty==='trans'){ o.price=num(t.price,base.price,0); o.rentBase=num(t.rentBase,base.rentBase,0); o.flavor=str(t.flavor,'',400); }
  if(ty==='util'){ o.price=num(t.price,base.price,0); o.mul1=num(t.mul1,base.mul1,0); o.mul2=num(t.mul2,base.mul2,0); o.flavor=str(t.flavor,'',400); }
  if(ty==='tax'){ o.amount=num(t.amount,base.amount,0); o.flavor=str(t.flavor,'',400); }
  if(ty==='elect'){ o.flavor=str(t.flavor,'',400); }
  return o;
}
function normCard(c){
  if(!c||typeof c!=='object') return null;
  return {id:str(c.id,'',40)||uid(),title:str(c.title,'Kartu tanpa judul',80),text:str(c.text,'',500),
    k:KINDS[c.k]?c.k:(c.k==='back'?'moveBy':'money'),v:num(c.v,0,-1000000,1000000),lv:num(c.lv,0,0),pp:num(c.pp,0,0),
    to:num(c.to,0,0,BOARD_N-1),n:c.k==='back'?-num(c.n,3,0,12):num(c.n,3,-12,12),type:TTYPES[c.type]?c.type:'elect',vote:num(c.vote,0,-10,10),enabled:c.enabled!==false};
}
function normalize(c){
  const d=defaultConfig(); if(!c||typeof c!=='object') return d;
  const o={v:2,updatedAt:num(c.updatedAt,0)};
  o.groups={}; for(const k in d.groups){ const g=(c.groups||{})[k]||{}; o.groups[k]={name:str(g.name,d.groups[k].name,40),color:/^#[0-9a-f]{6}$/i.test(g.color||'')?g.color:d.groups[k].color,votes:num(g.votes,d.groups[k].votes,0,5)}; }
  if(Array.isArray(c.tiles)&&c.tiles.length===BOARD_N){
    o.tiles=c.tiles.map((t,i)=>{ const def=d.tiles[i]; t=t&&typeof t==='object'?t:def;
      if(CORNERS.includes(i)) return {t:'corner',k:def.k,name:str(t.name,def.name,40),short:str(t.name,def.name,40),icon:str(t.icon,def.icon,8),desc:str(t.desc,def.desc,400)};
      const ty=TTYPES[t.t]?t.t:def.t; return fillTile({...t,t:ty},def); });
  } else o.tiles=d.tiles;
  o.takdir=Array.isArray(c.takdir)?c.takdir.map(normCard).filter(Boolean):d.takdir;
  o.musibah=Array.isArray(c.musibah)?c.musibah.map(normCard).filter(Boolean):d.musibah;
  const ids=new Set(DEFAULT_PRESETS.map(p=>p.id));
  o.presets=Array.isArray(c.presets)&&c.presets.length?c.presets.filter(p=>p&&typeof p==='object').map(p=>({id:str(p.id,'',40)||uid(),name:str(p.name,'Aturan tanpa nama',60),desc:str(p.desc,'',300),builtin:!!p.builtin&&ids.has(p.id),rules:normRules(p.rules)})):d.presets;
  if(!o.presets.length) o.presets=d.presets;
  o.activePreset=o.presets.some(p=>p.id===c.activePreset)?c.activePreset:o.presets[0].id;
  o.ranks=Array.isArray(c.ranks)&&c.ranks.length>=2?c.ranks.slice(0,8).map((r,i)=>{ r=r&&typeof r==='object'?r:{}; const dr=d.ranks[Math.min(i,d.ranks.length-1)];
    return {name:str(r.name,dr.name,40),icon:str(r.icon,dr.icon,8),cost:num(r.cost,dr.cost,0),fajar:num(r.fajar,dr.fajar,0),target:num(r.target,dr.target,2,20),salary:num(r.salary,dr.salary,0),rentPct:num(r.rentPct,dr.rentPct,0,300)}; }):d.ranks;
  return o;
}

/* ---------- penyimpanan (akun via db, cadangan di browser) ---------- */
const Store={db:null,ref:null,mode:'local',timer:null,busy:false,again:false,listeners:[],
  status:'Tersimpan di browser ini',
  setStatus(s){ this.status=s; this.listeners.forEach(f=>f(s)); },
  async init(){
    if(!window.claude||!window.claude.use) return;
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.db=db; this.ref=db.doc('data/users/'+id+'/config-jilid2');
      const snap=await this.ref.get();
      let remote=null; if(snap.exists){ try{ remote=JSON.parse(snap.data().json); }catch(e){} }
      this.mode='akun';
      if(remote&&num(remote.updatedAt,0)>CFG.updatedAt){ CFG=normalize(remote); saveLocal(); onConfigReplaced(); this.setStatus('Tersimpan di akunmu'); }
      else if(CFG.updatedAt>0){ await this.write(); }
      else this.setStatus('Tersimpan di akunmu');
    }catch(e){ this.mode='local'; this.setStatus('Tersimpan di browser ini'); }
  },
  schedule(){ CFG.updatedAt=Date.now(); saveLocal(); this.setStatus('Menyimpan…'); clearTimeout(this.timer); this.timer=setTimeout(()=>this.write(),800); },
  async write(){
    if(!this.ref){ this.setStatus('Tersimpan di browser ini'); return; }
    if(this.busy){ this.again=true; return; }
    this.busy=true;
    try{ await this.ref.set({json:JSON.stringify(CFG),updatedAt:CFG.updatedAt}); this.setStatus('Tersimpan di akunmu'); }
    catch(e){ if(e&&e.code==='unavailable'){ await sleep(1200+Math.random()*800); try{ await this.ref.set({json:JSON.stringify(CFG),updatedAt:CFG.updatedAt}); this.setStatus('Tersimpan di akunmu'); }catch(e2){ this.setStatus('Gagal menyimpan ke akun, tersimpan di browser ini'); } }
      else { this.ref=null; this.mode='local'; this.setStatus('Tersimpan di browser ini'); } }
    this.busy=false;
    if(this.again){ this.again=false; this.write(); }
  }
};
function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(CFG)); }catch(e){} }

/* ================= PAPAN ================= */
function gridPos(i){ if(i<=9) return {r:10,c:10-i}; if(i<=18) return {r:10-(i-9),c:1}; if(i<=27) return {r:1,c:1+(i-18)}; return {r:1+(i-27),c:10}; }
function cornerSub(t){ return {go:'+'+fmtS(R.salary)+' + tunjangan',jail:'besuk kolega',bansos:'cairkan hibah',gojail:'rompi oranye'}[t.k]||''; }
function buildBoard(){
  const b=$('#board'); b.querySelectorAll('.tile').forEach(e=>e.remove()); tileEls.length=0;
  TILES.forEach((t,i)=>{
    const {r,c}=gridPos(i); const el=document.createElement('div');
    const side=t.t==='corner'?'corner k-'+t.k:(i<9?'side-b':i<18?'side-l':i<27?'side-t':'side-r');
    el.className=`tile ${side} tt-${t.t}`; el.style.gridRow=r; el.style.gridColumn=c;
    el.setAttribute('role','button'); el.tabIndex=0; el.setAttribute('aria-label',t.name);
    let h;
    if(t.t==='prop') h=`<div class="band" style="background:${gColor(t.g)}"></div><div class="body"><span class="nm">${esc(t.short)}</span><span class="pr">${fmtS(t.price)}</span><span class="lv"></span></div>`;
    else if(t.t==='corner') h=`<div class="body"><span class="ic">${esc(t.icon)}</span><span class="nm">${esc(t.name)}</span><span class="sub">${cornerSub(t)}</span></div>`;
    else h=`<div class="body"><span class="ic">${esc(t.icon)}</span><span class="nm">${esc(t.short)}</span>${t.price?`<span class="pr">${fmtS(t.price)}</span>`:t.t==='tax'?`<span class="pr">−${fmtS(t.amount)}</span>`:''}<span class="lv"></span></div>`;
    el.innerHTML=h+'<div class="tokens"></div>';
    el.onclick=()=>showTileInfo(i);
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showTileInfo(i)}};
    b.appendChild(el); tileEls[i]={el,tok:el.querySelector('.tokens'),lv:el.querySelector('.lv')};
  });
}
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function buildDice(){
  ['#die0','#die1'].forEach(sel=>{ const d=$(sel); let h='';
    for(let v=1;v<=6;v++) h+=`<div class="face f${v}">`+PIPS[v].map(n=>`<span class="pip ${v===1||v===4?'red':''}" style="grid-row:${Math.ceil(n/3)};grid-column:${(n-1)%3+1}"></span>`).join('')+'</div>';
    d.innerHTML=h; });
  setDie(0,5,true); setDie(1,3,true);
}
const BASE={1:[0,0],2:[90,0],3:[0,-90],4:[0,90],5:[-90,0],6:[0,180]}; const spin=[0,0];
function setDie(idx,v,instant){ const el=$('#die'+idx); spin[idx]+=2; const [bx,by]=BASE[v];
  const kx=spin[idx]+(Math.random()<.5?1:0), ky=spin[idx]+1, z=Math.round(Math.random()*24-12);
  if(instant) el.style.transition='none';
  el.style.transform=`rotateZ(${z}deg) rotateX(${bx+360*kx}deg) rotateY(${by+360*ky}deg)`;
  if(instant){el.offsetHeight; el.style.transition=''} }
async function rollDice(a,b){ $('#sum').textContent=''; setDie(0,a); setDie(1,b);
  await sleep(matchMedia('(prefers-reduced-motion: reduce)').matches?120:1050);

function noteBreakdown(n){ const D=[1000000,100000,50000,10000,5000,1000]; const out=[]; let r=Math.max(0,Math.floor(n)); for(const d of D){ const c=Math.floor(r/d); if(c){out.push([d,c]); r-=c*d;} } return out; }

      <div class="rankline"><span class="rk">${rankOf(p).icon} ${esc(rankOf(p).name)}</span><span class="vt">Suara ${p.votes>0?'+':''}${p.votes}${assetVotes(p)?`, basis aset +${assetVotes(p)}`:''}</span></div>

function defaultHint(p){

function renderLog(){

function log(h,sep){ S.log.unshift({h,sep}); S.logN=(S.logN||0)+1; if(S.log.length>90) S.log.pop(); if(S.log.length&&$('#log')) renderLog(); }
function toast(h,kind=''){ const box=$('#toasts'); const el=document.createElement('div'); el.className='toast '+kind; el.innerHTML=h; box.appendChild(el); while(box.children.length>3) box.firstChild.remove(); setTimeout(()=>el.classList.add('out'),2600); setTimeout(()=>el.remove(),3000); }
function floatMoney(p,delta){
  if(!delta) return; const card=document.getElementById('pc-'+p.id); if(!card) return;

/* ================= EKONOMI ================= */
const ownsGroup=(pid,g)=>TILES.every((t,i)=>t.t!=='prop'||t.g!==g||S.own[i].owner===pid);
const countType=(pid,tt)=>TILES.filter((t,i)=>t.t===tt&&S.own[i].owner===pid).length;
const canRenov=(pid,i)=>{ const t=TILES[i],o=S.own[i]; return t.t==='prop'&&o.owner===pid&&o.level<R.maxRenov&&(!R.renovNeedsSet||ownsGroup(pid,t.g)); };
const sellValue=i=>{ const t=TILES[i],o=S.own[i]; return Math.floor((t.price+o.level*(t.build||0))*R.sellPct/100); };
function rentFor(i){ const base=rentBase(i), o=S.own[i]; if(o.owner===null) return base; return Math.round(base*(1+rankOf(S.players[o.owner]).rentPct/100)); }
function rentBase(i){
  const t=TILES[i], o=S.own[i];
  if(t.t==='prop'){ if(o.level>0) return t.rent[o.level]; return t.rent[0]*(ownsGroup(o.owner,t.g)?R.monopolyMult:1); }
  if(t.t==='trans') return t.rentBase*Math.pow(2,countType(o.owner,'trans')-1);
  if(t.t==='util') return S.lastSum*(countType(o.owner,'util')>=2?t.mul2:t.mul1);
  return 0;
}
function gain(p,amt){ p.cash+=amt; render(); floatMoney(p,amt); }
function liquidate(p,need){
  let guard=80;
  while(p.cash<need&&guard--){
    const mine=S.own.map((o,i)=>({o,i,t:TILES[i]})).filter(x=>x.o.owner===p.id);
    const built=mine.filter(x=>x.o.level>0).sort((a,b)=>a.t.build-b.t.build)[0];
    if(built){ built.o.level--; const v=Math.floor(built.t.build*R.sellPct/100); p.cash+=v; log(`🏚️ Ekspansi ${esc(built.t.name)} milik ${pn(p)} dibongkar paksa, laku ${fmt(v)}.`); continue; }
    const cheap=mine.sort((a,b)=>a.t.price-b.t.price)[0];
    if(cheap){ const v=Math.floor(cheap.t.price*R.sellPct/100); cheap.o.owner=null; p.cash+=v; log(`📜 ${esc(cheap.t.name)} milik ${pn(p)} disita dan dilelang ke bank seharga ${fmt(v)}.`); toast(`📜 ${esc(p.name)} terpaksa menjual ${esc(cheap.t.name)}`,'bad'); continue; }
    break;
  }
}
function charge(p,amount,creditor){
  amount=Math.round(amount); if(amount<=0||p.bankrupt) return 0;
  if(p.cash<amount) liquidate(p,amount);
  const paid=Math.min(amount,Math.max(0,p.cash)); p.cash-=paid;
  if(creditor==='pot') S.pot+=paid; else if(creditor&&typeof creditor==='object') creditor.cash+=paid;
  render(); floatMoney(p,-paid); if(creditor&&typeof creditor==='object') floatMoney(creditor,paid);
  if(paid<amount) bankrupt(p);
  return paid;
}
function bankrupt(p){
  p.bankrupt=true; p.jail=false; S.own.forEach(o=>{ if(o.owner===p.id){o.owner=null;o.level=0;} });
  log(`💀 ${pn(p)} bangkrut. Asetnya disita negara, ajudannya pindah ke calon lain.`); toast(`💀 ${esc(p.name)} bangkrut!`,'bad');
  render(); checkEnd();
}
function checkEnd(){ if(S.players.filter(p=>!p.bankrupt).length<=1&&!S.over) endGame('last'); }
function checkTarget(){
  if(!R.targetWealth||S.over) return false;
  if(S.players.some(p=>!p.bankrupt&&netWorth(p)>=R.targetWealth)){ endGame('target'); return true; }
  return false;
}
function goJail(p){ p.pos=9; p.jail=true; p.jailTurns=0; p.doubles=0; log(`🔒 ${pn(p)} masuk Rutan.`); toast(`🔒 ${esc(p.name)} masuk Rutan`,'bad'); render(); }
function payJail(p){ if(S.busy||!p.jail) return; charge(p,R.jailFine,fineDest()); if(!p.bankrupt){ p.jail=false; p.jailTurns=0; log(`💸 ${pn(p)} membayar uang jaminan ${fmt(R.jailFine)} dan keluar sambil melambaikan tangan ke kamera.`); toast('💸 Keluar dengan uang jaminan'); } render(); }
function useOrdal(p){ if(S.busy||!p.jail||p.ordal<1) return; p.ordal--; p.jail=false; p.jailTurns=0; log(`🎫 ${pn(p)} menelepon Orang Dalam. Statusnya mendadak jadi tahanan kota.`); toast('🎫 Ordal bekerja!','good'); render(); }
function inflate(){
  const f=1+R.inflationPct/100; if(f===1) return;
  TILES.forEach(t=>{ ['price','build','rentBase','mul1','mul2','amount'].forEach(k=>{ if(typeof t[k]==='number'&&t[k]>0) t[k]=round25(t[k]*f); }); if(t.rent) t.rent=t.rent.map(x=>round25(x*f)); });
  if(R.salaryFollowsInflation) R.salary=round25(R.salary*f);
  log(`📈 Inflasi ${R.inflationPct}%! Harga aset, sewa, dan pungutan naik.${R.salaryFollowsInflation?' Gaji ikut naik.':' Gaji? Tetap. Sabar.'}`,true);
  toast(`📈 Inflasi ${R.inflationPct}%: semua harga naik`,'bad');
  buildBoard();
}

/* ================= GERAK ================= */
async function moveForward(p,n){
  for(let k=0;k<n;k++){ p.pos=(p.pos+1)%BOARD_N;
    if(p.pos===0){ const tj=rankOf(p).salary, tot=R.salary+tj; p.cash+=tot; log(`💼 ${pn(p)} lewat SETORAN, terima ${fmt(R.salary)}${tj?` + tunjangan jabatan ${fmt(tj)}`:''}.`); floatMoney(p,tot); }
    renderTiles(); await sleep(170); }
  render();
}
async function moveBack(p,n){ for(let k=0;k<n;k++){ p.pos=(p.pos-1+BOARD_N)%BOARD_N; renderTiles(); await sleep(170);} render(); }
async function moveTo(p,target){ await moveForward(p,(target-p.pos+BOARD_N)%BOARD_N); }

/* ================= RESOLUSI KOTAK ================= */
async function resolveTile(p){
  if(p.bankrupt||S.over) return;
  const i=p.pos, t=TILES[i]; render();
  if(isAsset(t)){
    const o=S.own[i];
    if(o.owner===null) await offerBuy(p,i);
    else if(o.owner!==p.id){
      const ow=S.players[o.owner];
      if(ow.jail&&!R.rentInJail){ log(`${pn(p)} singgah di ${esc(t.name)}, tapi pemiliknya sedang di sel. Sewa gratis!`); toast('🔓 Pemilik di sel, sewa gratis','good'); }
      else { const r=rentFor(i); log(`🏷️ ${pn(p)} singgah di ${esc(t.name)} milik ${pn(ow)} dan membayar sewa ${fmt(r)}.`); toast(`${p.char} bayar sewa ${fmt(r)} ke ${esc(ow.name)}`,'bad'); charge(p,r,ow); }
    } else log(`${pn(p)} mampir ke asetnya sendiri, ${esc(t.name)}. Ngopi dulu.`);
  } else if(t.t==='tax'){
    log(`${esc(t.icon)} ${pn(p)} kena ${esc(t.name)} ${fmt(t.amount)}.${R.finesToPot?' Masuk ke dana hibah.':''}`); toast(`${esc(t.icon)} ${esc(t.name)}: ${fmt(-t.amount)}`,'bad'); charge(p,t.amount,fineDest());
  } else if(t.t==='takdir'||t.t==='musibah'){ await drawCard(p,t.t); }
  else if(t.t==='elect'){ await runElection(p,t); }
  else if(t.k==='go'){ if(R.landGoBonus>0){ log(`🎯 ${pn(p)} berhenti tepat di SETORAN, dapat bonus ${fmt(R.landGoBonus)}.`); gain(p,R.landGoBonus); } }
  else if(t.k==='bansos'){
    if(S.pot>0){ const got=Math.floor(S.pot*(100-R.bansosCutPct)/100), cut=S.pot-got; S.pot=0;
      log(`🎁 ${pn(p)} mencairkan dana hibah ${fmt(got)} lewat yayasan kenalan.${cut?` Sebanyak ${fmt(cut)} jadi "biaya koordinasi".`:' Utuh, tanpa potongan. Mencurigakan.'}`); toast(`🎁 Hibah cair ${fmt(got)}`,'good'); gain(p,got); }
    else { log(`🎁 ${pn(p)} mengajukan dana hibah, tapi kasnya kosong. Coba lagi tahun anggaran depan.`); toast('🎁 Dana hibah kosong'); }
  } else if(t.k==='gojail'){ toast(`🚨 ${esc(t.name)}`,'bad'); log(`🚨 ${pn(p)} kena ${esc(t.name)} Rompi oranye sudah disiapkan.`); goJail(p); if(R.ottDemote&&p.rank>0) setRank(p,-1,'karena dicopot partai'); }
  else if(t.k==='jail'){ log(`${pn(p)} cuma mampir ke ${esc(t.name)}, membesuk kolega separtai.`); }
  render();
}
async function offerBuy(p,i){
  const t=TILES[i], mand=R.buyMode==='mandatory';
  if(p.isBot){ await sleep(450);
    if(mand){ if(p.cash>=t.price) buy(p,i); else log(`${pn(p)} tidak mampu membeli ${esc(t.name)}.`); return; }
    const wantsGroup=t.t==='prop'&&TILES.some((x,j)=>x.t==='prop'&&x.g===t.g&&j!==i&&S.own[j].owner===p.id);
    if(p.cash-t.price>=R.startCash*(wantsGroup?0.04:0.1)) buy(p,i); else log(`${pn(p)} melewatkan ${esc(t.name)}. "Nanti dulu, nunggu harga turun."`);
    return; }
  const res=await showDeed(i,{buy:true,player:p,mandatory:mand});
  if(res==='buy') buy(p,i); else log(`${pn(p)} ${mand?'tidak mampu membeli':'melewatkan'} ${esc(t.name)}.`);
}
function buy(p,i){ const t=TILES[i]; if(p.cash<t.price) return; p.cash-=t.price; S.own[i].owner=p.id; log(`🏡 ${pn(p)} membeli ${esc(t.name)} seharga ${fmt(t.price)}.`); toast(`🏡 ${esc(p.name)} membeli ${esc(t.name)}`,'good'); render(); floatMoney(p,-t.price); }

/* ================= KARTU ================= */
function draw(kind){ if(!S.cards[kind].length) return null; if(!S.decks[kind].length) S.decks[kind]=shuffle(S.cards[kind].slice()); return S.decks[kind].pop(); }
function effCard(c){ const m=(R?R.cardMultPct:100)/100, o={...c}; o.vote=c.vote||0;
  if(c.k==='money'||c.k==='each') o.v=Math.round(c.v*m); if(c.k==='repair'){ o.lv=Math.round(c.lv*m); o.pp=Math.round(c.pp*m); } return o; }
function effLabel(c,tiles){ const e=effLabel0(c,tiles); if(c.vote){ const vs=`${c.vote>0?'+':''}${c.vote} suara`; e.t=e.t?`${e.t}, ${vs}`:vs; if(!e.cls) e.cls=c.vote>0?'pos':'neg'; } return e; }
function effLabel0(c,tiles){ tiles=tiles||TILES;
  switch(c.k){
    case 'vote': return {t:'',cls:''};
    case 'rankUp': return {t:'Naik satu jenjang jabatan',cls:'pos'};
    case 'rankDown': return {t:'Turun satu jenjang jabatan',cls:'neg'};
    case 'money': return {t:(c.v>0?'+':'')+fmt(c.v),cls:c.v>0?'pos':c.v<0?'neg':''};
    case 'percent': return {t:`${c.v>0?'+':'−'}${Math.abs(c.v)}% uang tunai`,cls:c.v>0?'pos':'neg'};
    case 'each': return c.v>0?{t:`+${fmt(c.v)} dari tiap pemain`,cls:'pos'}:{t:`${fmt(c.v)} ke tiap pemain`,cls:'neg'};
    case 'repair': return {t:`−${fmtS(c.lv)}/tingkat, −${fmtS(c.pp)}/aset`,cls:'neg'};
    case 'moveTo': return {t:`Pindah ke ${(tiles[c.to]||{}).name||'?'}`,cls:''};
    case 'moveBy': return {t:c.n>=0?`Maju ${c.n} langkah`:`Mundur ${-c.n} langkah`,cls:c.n<0?'neg':''};
    case 'nearest': return {t:`Maju ke ${TTYPES[c.type]} terdekat`,cls:''};
    case 'jail': return {t:'Masuk Rutan',cls:'neg'};
    case 'ordal': return {t:'Simpan kartu ini',cls:'pos'};
  } return {t:'',cls:''};
}
async function drawCard(p,kind){
  const raw=draw(kind); const name=kind==='takdir'?'Kartu Takdir':'Kartu Musibah';
  if(!raw){ log(`${name} sedang habis. ${pn(p)} selamat kali ini.`); toast(`Tumpukan ${name} kosong`); return; }
  const card=effCard(raw); const deckEl=kind==='takdir'?$('#deckT'):$('#deckM');
  deckEl.classList.remove('flash'); deckEl.offsetHeight; deckEl.classList.add('flash');
  log(`${kind==='takdir'?'🔮':'⚠️'} ${name} untuk ${pn(p)}: “${esc(card.title)}”.`);
  await showCard(kind,card,p); await applyCard(p,card);
}
async function applyCard(p,c){
  switch(c.k){
    case 'money': if(c.v>=0) gain(p,c.v); else charge(p,-c.v,fineDest()); break;
    case 'percent': { const amt=Math.round(Math.max(0,p.cash)*Math.abs(c.v)/100); if(c.v>=0) gain(p,amt); else charge(p,amt,fineDest()); log(`${pn(p)} ${c.v>=0?'menerima':'kehilangan'} ${fmt(amt)}.`); break; }
    case 'each': for(const q of S.players){ if(q===p||q.bankrupt) continue; if(c.v>0) charge(q,c.v,p); else charge(p,-c.v,q); if(p.bankrupt||S.over) break; } break;
    case 'repair': { let lv=0,n=0; S.own.forEach(o=>{ if(o.owner===p.id){ n++; lv+=o.level; } }); const cost=lv*c.lv+n*c.pp;
      if(cost>0){ log(`${pn(p)} membayar ${fmt(cost)} (${lv} tingkat renovasi, ${n} aset).`); charge(p,cost,fineDest()); }
      else log(`${pn(p)} tidak punya aset, jadi aman. Satu-satunya keuntungan jadi miskin.`); break; }
    case 'moveTo': await moveTo(p,c.to); await resolveTile(p); break;
    case 'moveBy': if(c.n>0) await moveForward(p,c.n); else if(c.n<0) await moveBack(p,-c.n); await resolveTile(p); break;
    case 'nearest': { let j=-1; for(let k=1;k<=BOARD_N;k++){ const x=(p.pos+k)%BOARD_N; if(TILES[x].t===c.type){ j=x; break; } }
      if(j<0){ log(`Tidak ada kotak ${TTYPES[c.type]} di papan.`); break; } await moveTo(p,j); await resolveTile(p); break; }
    case 'jail': goJail(p); break;
    case 'ordal': p.ordal++; render(); break;
    case 'rankUp': if(!setRank(p,1,'lewat jalur kartu')) log(`${pn(p)} sudah di puncak, tidak bisa naik lagi.`); if(R.rankWin&&p.rank>=topRank()&&!S.over){ endGame('rank'); return; } break;
    case 'rankDown': if(!setRank(p,-1,'')) log(`${pn(p)} belum punya jabatan untuk dicopot. Untung.`); break;
  }
  if(c.vote&&!p.bankrupt&&!S.over){ addVotes(p,c.vote); render(); }
}

/* ================= OVERLAY UMUM ================= */
function overlay(html,cls=''){ const ov=document.createElement('div'); ov.className='overlay '+cls; ov.innerHTML=html; document.body.appendChild(ov); return ov; }
function showCard(kind,card,p){
  return new Promise(res=>{
    const dc=kind==='takdir'?'var(--takdir)':'var(--musibah)', name=kind==='takdir'?'Kartu Takdir':'Kartu Musibah', e=effLabel(card);
    const ov=overlay(`<div class="cardstage" style="--dc:${dc}"><div class="card3d"><div class="card-inner">
        <div class="cface cback"><div>${kind==='takdir'?'🔮':'⚠️'}</div>${name}</div>
        <div class="cface cfront"><div class="chead"><span>${name}</span><span>${p.char}</span></div>
          <div class="cbody"><h2>${esc(card.title)}</h2><p>${esc(card.text)}</p><div class="eff ${e.cls}">${esc(e.t)}</div></div></div>
      </div></div><button class="primary" id="cardOk" style="visibility:hidden">${p.isBot?`${esc(p.name)} pasrah…`:(kind==='takdir'?'Terima takdir':'Pasrah')}</button></div>`);
    const inner=ov.querySelector('.card-inner'), ok=ov.querySelector('#cardOk'); let done=false;

    ok.onclick=close; if(p.isBot) setTimeout(close,2600);
  });
}
function deedHTML(i){
  const t=TILES[i], o=S?S.own[i]:{owner:null,level:0};
  const color=t.t==='prop'?gColor(t.g):'#37474f';
  let rows='';
  if(t.t==='prop'){
    rows=`<tr><td>Kelompok</td><td>${esc((GROUPS[t.g]||{}).name||'')}</td></tr><tr><td>Sewa dasar</td><td>${fmt(t.rent[0])}</td></tr>
      <tr><td>Sewa jika kelompok lengkap</td><td>${fmt(t.rent[0]*R.monopolyMult)}</td></tr>`;
    for(let k=1;k<=R.maxRenov;k++) rows+=`<tr><td>${'🏠'.repeat(k)} Ekspansi ${k}</td><td>${fmt(t.rent[k])}</td></tr>`;

async function electionSeason(){
  S.busy=true; S.hint='Pemilu serentak sedang berlangsung…'; render();
  log(`🗳️ PEMILU SERENTAK digelar di awal putaran ${S.round}! Semua calon boleh nyalon ke jenjang berikutnya.`,true);
  toast('🗳️ Pemilu serentak dimulai!','good'); await sleep(700);
  for(const p of S.players){
    if(p.bankrupt||S.over) continue;
    if(p.jail){ log(`${pn(p)} sedang di Rutan, jadi tidak bisa nyalon kali ini. Konon ada yang tetap mencoba.`); continue; }
    if(!RANKS[p.rank+1]) continue;
    await runElection(p,{name:'Pemilu serentak'});
  }
  S.busy=false; S.hint='';
}
async function runElection(p,t){
  const next=RANKS[p.rank+1];
  if(!next){ log(`${pn(p)} singgah di ${esc(t.name)}, tapi sudah di puncak jabatan. Cukup jadi tamu kehormatan.`); return; }
  const bonus=assetVotes(p); let choice;
  if(p.isBot){ await sleep(450); const sc=R.startCash;
    if(R.fajarBonus&&p.cash-next.cost-next.fajar>=sc*0.15) choice='fajar'; else if(p.cash-next.cost>=sc*0.2) choice='run'; else choice='skip'; }
  else choice=await showElection(p,next,bonus);
  if(choice==='skip'){ log(`${pn(p)} belum mau nyalon jadi ${esc(next.name)}. "Belum ada bisikan dari rakyat."`); return; }
  const fajar=choice==='fajar', cost=next.cost+(fajar?next.fajar:0);
  if(p.cash<cost){ log(`${pn(p)} tidak punya cukup modal untuk nyalon.`); return; }
  charge(p,cost,fineDest());
  log(`🗳️ ${pn(p)} nyalon jadi ${esc(next.name)} dengan modal ${fmt(cost)}${fajar?', termasuk amplop serangan fajar':''}.`);
  const d1=rnd6(), d2=rnd6(); await rollDice(d1,d2);
  const total=d1+d2+p.votes+bonus+(fajar?R.fajarBonus:0);
  const detail=`Dadu ${d1+d2} + elektabilitas ${p.votes} + basis aset ${bonus}${fajar?` + serangan fajar ${R.fajarBonus}`:''}`;
  const win=total>=next.target;
  log(`${detail} = <b>${total}</b> (target ${next.target}).`);
  if(R.votesReset) p.votes=0;
  if(win) setRank(p,1,'lewat pemilu'); else { log(`😵 ${pn(p)} kalah. Baliho diturunkan, utang kampanye tetap jalan.`); toast(`😵 ${esc(p.name)} kalah pemilu`,'bad'); }
  render();
  if(!p.isBot) await showElectResult(p,win,next,total,detail); else await sleep(600);
  if(win&&R.rankWin&&p.rank>=topRank()&&!S.over) endGame('rank');
}

let studioOnClose=null;
function openStudio(tab,onClose){
  ST.tab=tab||ST.tab; ST.open=null; ST.preset=CFG.activePreset; studioOnClose=onClose||null;
  const ov=overlay(`<div class="sheet studio"><div class="studio-top"><h2>🛠️ Studio kustomisasi</h2><span class="savestat" id="stSave">${esc(Store.status)}</span><button class="primary" id="stClose">Selesai</button></div>
    <div class="tabs" role="tablist"><button data-tab="tiles">Kotak papan</button><button data-tab="takdir">Kartu Takdir</button><button data-tab="musibah">Kartu Musibah</button><button data-tab="ranks">Jenjang jabatan</button><button data-tab="rules">Koleksi aturan</button><button data-tab="io">Simpan dan bagikan</button></div>
    <div id="stBody"></div></div>`);
  const sh=ov.firstChild;
  const statusFn=s=>{ const e=sh.querySelector('#stSave'); if(e) e.textContent=s; }; Store.listeners.push(statusFn);
  let dirty=false;
  const changed=()=>{ dirty=true; Store.schedule(); };
  const close=()=>{ Store.listeners=Store.listeners.filter(f=>f!==statusFn); ov.remove();
    if(dirty&&!gameLive()){ S=null; useIdleConfig(); buildBoard(); render(); }
    if(studioOnClose) studioOnClose(); };
  sh.querySelector('#stClose').onclick=close;
  const redraw=()=>{ const y=sh.scrollTop; drawStudioTab(sh); sh.scrollTop=y; };
  const onField=e=>{
    const el=e.target; if(!el.dataset||!el.dataset.p) return;
    const t=el.dataset.t, path=el.dataset.p; let v;
    if((t==='ttype'||t==='kind')&&e.type!=='change') return;
    if(t==='bool') v=el.checked;
    else if(t==='money'||t==='num'||t==='pct'||t==='int'){ if(el.value===''||isNaN(+el.value)) return; v=Math.round(+el.value); if(el.min!=='' && el.min!=null) v=Math.max(+el.min,v); if(el.max!=='' && el.max!=null) v=Math.min(+el.max,v); if(e.type==='change') el.value=v; }
    else if(t==='ttype'){ const i=+path.split('.')[1]; const old=CFG.tiles[i]; const nt=el.value; const base={t:nt,name:old.name,short:old.short,icon:old.icon,...clone(TDEF[nt])};
      if(nt==='takdir'||nt==='musibah'){ base.name=TTYPES[nt]; base.short=nt==='takdir'?'Takdir':'Musibah'; base.icon=TDEF[nt].icon; }
      else if(old.t==='takdir'||old.t==='musibah'){ base.name=TTYPES[nt]+' baru'; base.short=TTYPES[nt]; }
      if(old.flavor) base.flavor=old.flavor; if(nt==='prop') delete base.icon; else if(!old.icon||old.t==='takdir'||old.t==='musibah') base.icon=TDEF[nt].icon;
      CFG.tiles[i]=fillTile(base,base); changed(); redraw(); return; }
    else if(t==='kind'){ const [k,i]=path.split('.'); const c=CFG[k][+i]; c.k=el.value; changed(); redraw(); return; }
    else v=el.value;
    setPath(CFG,path,v);
    const cm=path.match(/^tiles\.(\d+)\.name$/); if(cm&&CFG.tiles[+cm[1]].t==='corner') CFG.tiles[+cm[1]].short=v;
    changed();
    if(t==='money'){ const sm=el.parentElement.querySelector('small.prev'); if(sm) sm.textContent='dalam ribuan, = '+fmt(v); }
    if(el.dataset.struct&&e.type==='change'){ redraw(); return; }
    const row=el.closest('.srow'); if(row){ const hd=row.querySelector('.shead'); if(hd) hd.innerHTML=headFor(row.dataset.row); }
  };
  sh.addEventListener('input',onField); sh.addEventListener('change',onField);
  sh.addEventListener('click',async e=>{
    const tb=e.target.closest('[data-tab]'); if(tb){ ST.tab=tb.dataset.tab; ST.open=null; drawStudioTab(sh); return; }
    const op=e.target.closest('[data-open]'); if(op){ const k=op.dataset.open; ST.open=ST.open===k?null:k; redraw(); return; }
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.dataset.act, kind=b.dataset.k, idx=+b.dataset.i, v=b.dataset.v;
    if(act==='addcard'){ CFG[kind].push({id:uid(),title:kind==='takdir'?'Takdir baru':'Musibah baru',text:'',k:'money',v:kind==='takdir'?1000:-1000,lv:0,pp:0,to:0,n:3,type:'trans',enabled:true}); ST.open=kind+':'+(CFG[kind].length-1); changed(); redraw();
      const r=sh.querySelector(`[data-row="${ST.open}"]`); if(r&&r.scrollIntoView) r.scrollIntoView({block:"center"}); }
    else if(act==='dupcard'){ const c=clone(CFG[kind][idx]); c.id=uid(); c.title+=' (salinan)'; CFG[kind].splice(idx+1,0,c); ST.open=kind+':'+(idx+1); changed(); redraw(); }
    else if(act==='delcard'){ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Yakin hapus? Klik lagi'; return; } CFG[kind].splice(idx,1); ST.open=null; changed(); redraw(); }
    else if(act==='allcards'){ CFG[kind].forEach(c=>c.enabled=v==='1'); changed(); redraw(); }
    else if(act==='selpreset'){ ST.preset=v; redraw(); }
    else if(act==='usepreset'){ CFG.activePreset=v; changed(); redraw(); }
    else if(act==='newpreset'){ const p={id:uid(),name:'Aturan buatanku',desc:'',builtin:false,rules:{...BASE_RULES}}; CFG.presets.push(p); ST.preset=p.id; changed(); redraw(); }
    else if(act==='duppreset'){ const src=CFG.presets.find(p=>p.id===v); const p={...clone(src),id:uid(),name:src.name+' (salinan)',builtin:false}; CFG.presets.push(p); ST.preset=p.id; changed(); redraw(); }
    else if(act==='resetpreset'){ const d=DEFAULT_PRESETS.find(p=>p.id===v); const p=CFG.presets.find(p=>p.id===v); if(d&&p){ p.name=d.name; p.desc=d.desc; p.rules={...BASE_RULES,...d.r}; changed(); redraw(); toast('Koleksi aturan dipulihkan'); } }
    else if(act==='delpreset'){ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Yakin hapus? Klik lagi'; return; } CFG.presets=CFG.presets.filter(p=>p.id!==v); if(CFG.activePreset===v) CFG.activePreset=CFG.presets[0].id; ST.preset=CFG.activePreset; changed(); redraw(); }
    else if(act==='export'){ const json=JSON.stringify(CFG,null,2); let ok=false;
      try{ const dl=window.claude&&window.claude.use?await claude.use('downloads'):null; if(dl){ await dl.save({filename:'republik62-jilid2-edisi.json',data:json}); ok=true; toast('Edisi diekspor','good'); } }catch(err){ if(err&&err.code==='declined') ok=true; }
      if(!ok&&!(window.claude&&window.claude.use)){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download='republik62-jilid2-edisi.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); ok=true; toast('Edisi diekspor','good'); }catch(err){} }
      if(!ok){ ST.io=json; redraw(); toast('Salin JSON dari kotak impor di bawah'); } }
    else if(act==='showjson'){ ST.io=JSON.stringify(CFG,null,2); redraw(); const ta=sh.querySelector('#ioText'); if(ta){ ta.focus(); ta.select(); } }
    else if(act==='import'){ const txt=sh.querySelector('#ioText').value; let data;
      try{ data=JSON.parse(txt); }catch(err){ sh.querySelector('#ioErr').textContent='Isi bukan JSON yang valid. Pastikan disalin utuh dari hasil ekspor.'; return; }
      if(!data||!Array.isArray(data.tiles)||data.tiles.length!==BOARD_N){ sh.querySelector('#ioErr').textContent='Data tidak dikenali: papan harus berisi tepat 36 kotak.'; return; }
      CFG=normalize(data); ST.io=''; changed(); redraw(); toast('Edisi berhasil diimpor','good'); }
    else if(act==='addrank'){ const last=CFG.ranks[CFG.ranks.length-1]; CFG.ranks.push({name:'Jabatan baru',icon:'⭐',cost:Math.round(last.cost*1.4/5000)*5000||100000,fajar:Math.round(last.fajar*1.4/5000)*5000||50000,target:Math.min(20,(last.target||8)+1),salary:Math.round(last.salary*1.4/5000)*5000,rentPct:Math.min(300,last.rentPct+15)}); ST.open='rank:'+(CFG.ranks.length-1); changed(); redraw(); }
    else if(act==='delrank'){ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Yakin hapus? Klik lagi'; return; } CFG.ranks.splice(idx,1); ST.open=null; changed(); redraw(); }
    else if(act==='resetall'){ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Yakin? Semua perubahan hilang. Klik lagi'; return; } CFG=defaultConfig(); changed(); redraw(); toast('Semua dikembalikan ke bawaan'); }
  });
  drawStudioTab(sh);
}

  };
  setupRedraw=()=>{ if(document.body.contains(ov)) draw(); };
  sh.oninput=e=>{ if(e.target.matches('input[data-i]')) setup.slots[+e.target.dataset.i].name=e.target.value; };
  sh.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const act=b.dataset.act, i=+b.dataset.i;
    if(act==='type'){ const s=setup.slots[i], v=b.dataset.v;
      if(v==='bot'&&/^Pemain \d$/.test(s.name)) s.name=BOT_NAMES[i];
      if(v==='human'&&BOT_NAMES.includes(s.name)) s.name=`Pemain ${i+1}`;
      s.type=v; if(v!=='off'&&used(s.char,i)) s.char=CHARS.findIndex((_,ci)=>!used(ci,i)); draw(); }
    else if(act==='char'){ setup.slots[i].char=+b.dataset.v; draw(); }
    else if(act==='preset'){ CFG.activePreset=b.dataset.v; Store.schedule(); if(!gameLive()){ R={...activePreset().rules}; buildBoard(); render(); } draw(); }
    else if(act==='studio') openStudio('rules',draw);
    else if(act==='rules') showRules();
    else if(act==='start'){
      const a=setup.slots.filter(s=>s.type!=='off'), err=sh.querySelector('#setupErr');
      if(a.length<2){ err.textContent='Butuh minimal 2 peserta. Isi kursi kosong dengan bot.'; return; }
      if(!a.some(s=>s.type==='human')){ err.textContent='Butuh minimal 1 pemain manusia.'; return; }
      ov.remove(); setupRedraw=null; newGame(); }
  };
  draw();
}
function newGame(){
  const preset=activePreset();
  R=clone(preset.rules); TILES=clone(CFG.tiles); GROUPS=clone(CFG.groups);
  const cards={takdir:CFG.takdir.filter(c=>c.enabled).map(clone),musibah:CFG.musibah.filter(c=>c.enabled).map(clone)};
  const players=[];
  setup.slots.forEach((s,i)=>{ if(s.type==='off') return;
    players.push({id:players.length,name:(s.name||'').trim()||`Pemain ${i+1}`,char:CHARS[s.char][0],charName:CHARS[s.char][1],color:PCOLORS[i],isBot:s.type==='bot',cash:R.startCash,pos:0,jail:false,jailTurns:0,ordal:0,bankrupt:false,doubles:0,rank:0,votes:0}); });
  RANKS=clone(CFG.ranks);
  S={players,cur:0,phase:'roll',pot:R.bansosStart,round:1,own:TILES.map(()=>({owner:null,level:0})),ruleName:preset.name,
     cards,decks:{takdir:shuffle(cards.takdir.slice()),musibah:shuffle(cards.musibah.slice())},busy:false,lastSum:7,log:[],over:false,notesOpen:new Set(),hint:'',botTimer:null};
  buildBoard();
  log(`🇮🇩 Selamat datang di Republik +62 jilid 2. Koleksi aturan: <b>${esc(preset.name)}</b>. Kalian semua baru dapat ganti untung jalan tol. Saatnya mengabdi pada bangsa (dan keluarga).`);
  if(R.startAssets>0){
    const pool=shuffle(TILES.map((t,i)=>isAsset(t)?i:-1).filter(i=>i>=0));
    for(let k=0;k<R.startAssets;k++) for(const p of players){ const i=pool.pop(); if(i==null) break; S.own[i].owner=p.id; log(`🎁 ${pn(p)} mewarisi ${esc(TILES[i].name)} dari keluarga besar.`); }
  }
  log(`— Giliran ${pn(players[0])} —`,true);
  $('#sum').textContent='';
  render(); toast(`Giliran ${players[0].char} ${esc(players[0].name)}`); maybeBot();
}

/* ================= ALUR GILIRAN ================= */
async function onRoll(){
  if(!S||S.busy||S.phase!=='roll'||S.over) return;
  const p=cur(); S.busy=true; S.hint=''; renderControls();
  const d1=rnd6(), d2=rnd6(), sum=d1+d2, dbl=d1===d2;
  await rollDice(d1,d2); S.lastSum=sum;
  log(`🎲 ${pn(p)} mengocok ${d1} + ${d2} = <b>${sum}</b>${dbl?' (kembar!)':''}`);
  let again=false;
  if(p.jail){
    if(dbl){ p.jail=false; p.jailTurns=0; log(`🔓 Kembar! ${pn(p)} keluar dari Rutan.`); toast('🔓 Bebas dengan dadu kembar','good'); await moveForward(p,sum); await resolveTile(p); }
    else { p.jailTurns++;
      if(p.jailTurns>=R.jailMaxTurns){ log(`${pn(p)} sudah ${p.jailTurns} giliran di Rutan, wajib bayar uang jaminan.`); charge(p,R.jailFine,fineDest());
        if(!p.bankrupt){ p.jail=false; p.jailTurns=0; await moveForward(p,sum); await resolveTile(p); } }
      else { log(`🔒 ${pn(p)} masih ditahan (${p.jailTurns}/${R.jailMaxTurns}).`); S.hint='Belum kembar. Masih ditahan, tapi sel VIP.'; } }
  } else {
    if(dbl&&R.doublesAgain){ p.doubles++; if(R.tripleJail&&p.doubles>=3){ log(`🚨 Kembar tiga kali? Mencurigakan. ${pn(p)} diamankan.`); goJail(p); } else again=true; }
    if(!p.jail){ await moveForward(p,sum); await resolveTile(p); }
  }
  S.busy=false;
  if(S.over){ render(); return; }
  if(checkTarget()) return;
  if(p.bankrupt){ render(); await sleep(700); nextTurn(); return; }
  S.phase=(again&&!p.jail&&!p.bankrupt)?'roll':'end';
  if(S.phase==='roll') S.hint='Dadu kembar! Kocok sekali lagi.';
  render(); maybeBot();
}
function endTurn(){ if(!S||S.busy||S.phase!=='end'||S.over) return; nextTurn(); }
async function nextTurn(){
  if(S.over) return;
  const n=S.players.length, prev=S.cur; let i=prev;
  for(let k=0;k<n;k++){ i=(i+1)%n; if(!S.players[i].bankrupt) break; }
  if(i<=prev){ S.round++;
    if(R.roundLimit&&S.round>R.roundLimit){ endGame('limit'); return; }
    if(R.inflationEvery&&(S.round-1)%R.inflationEvery===0) inflate();
    if(R.electionEvery&&(S.round-1)%R.electionEvery===0){ await electionSeason(); if(S.over) return; } }
  S.cur=i; const p=cur(); p.doubles=0; S.phase='roll'; S.hint='';
  log(`— Giliran ${pn(p)} —`,true); toast(`Giliran ${p.char} ${esc(p.name)}`);
  render(); if(checkTarget()) return; maybeBot();
}
function maybeBot(){ if(!S) return; clearTimeout(S.botTimer); if(S.over||S.busy) return; if(!cur().isBot) return; S.botTimer=setTimeout(botStep,750); }
function botStep(){
  if(!S||S.over||S.busy) return; const p=cur(); if(!p.isBot) return;
  if(S.phase==='roll'){ if(p.jail){ if(p.ordal>0) useOrdal(p); else if(p.cash>=R.startCash*0.28) payJail(p); } onRoll(); }
  else if(S.phase==='end'){ botBuild(p); render(); S.botTimer=setTimeout(()=>{ if(S&&!S.over&&cur()===p&&S.phase==='end') endTurn(); },600); }
}
function botBuild(p){
  for(let k=0;k<12;k++){
    const c=S.own.map((o,i)=>({o,i,t:TILES[i]})).filter(x=>canRenov(p.id,x.i)&&p.cash-x.t.build>=R.startCash*0.2).sort((a,b)=>a.o.level-b.o.level||b.t.price-a.t.price)[0];
    if(!c) break; p.cash-=c.t.build; c.o.level++; log(`🔨 ${pn(p)} mengekspansi ${esc(c.t.name)} ke tingkat ${c.o.level}.`); toast(`🔨 ${esc(p.name)} mengekspansi ${esc(c.t.name)}`);
  }
}
function endGame(reason){
  S.over=true; S.phase='over'; clearTimeout(S.botTimer);
  const byRank=reason!=='target'&&R.rankWin;
  const alive=S.players.filter(p=>!p.bankrupt).sort((a,b)=>byRank&&b.rank!==a.rank?b.rank-a.rank:netWorth(b)-netWorth(a));
  const ranking=[...alive,...S.players.filter(p=>p.bankrupt)];
  log(`🏁 Permainan selesai. ${pn(ranking[0])} keluar sebagai pemenang, menjabat ${esc(rankOf(ranking[0]).name)}.`,true); render();
  const why={rank:`${esc(ranking[0].name)} resmi dilantik sebagai ${esc(rankOf(ranking[0]).name)}. Dari tukang tanah jadi penentu kebijakan negara.`,limit:`Batas putaran tercapai. Pemenang ditentukan dari ${R.rankWin?'jabatan tertinggi, lalu ':''}kekayaan bersih.`,target:`Kekayaan bersih menembus target ${fmt(R.targetWealth)}. Jabatan hanyalah formalitas.`,last:'Semua pesaing sudah bangkrut atau ditahan. Demokrasi tinggal satu calon.'}[reason];
  const ov=overlay(`<div class="sheet" style="max-width:460px"><div style="font-size:3rem;text-align:center">🏆</div>
    <h2 style="text-align:center">${ranking[0].char} ${esc(ranking[0].name)} menang!</h2><p style="text-align:center" class="psub">${why}</p>
    <div class="rank">${ranking.map((p,k)=>`<div style="border-left:6px solid ${p.color}"><span class="pos">${k+1}</span><span style="font-size:1.5rem">${p.char}</span><span style="flex:1"><b>${esc(p.name)}</b><br><span class="ttl">${p.bankrupt?'Bangkrut, kini jadi saksi':rankOf(p).icon+' '+esc(rankOf(p).name)}</span></span><b>${p.bankrupt?'Bangkrut':fmt(netWorth(p))}</b></div>`).join('')}</div>
    <div class="actions"><button id="eView">Lihat papan</button><button class="primary" id="eAgain">Main lagi</button></div></div>`);
  ov.querySelector('#eView').onclick=()=>ov.remove();
  ov.querySelector('#eAgain').onclick=()=>{ ov.remove(); showSetup(); };
}
